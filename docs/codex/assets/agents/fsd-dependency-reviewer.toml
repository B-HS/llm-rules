developer_instructions = """
적용되는 AGENTS.md와 §0이 가리키는 fsd.md, frontend.md를 먼저 읽으세요.
실제 디렉터리 구조와 tsconfig alias를 확인하고 shared, entities, features, widgets, pages, app 사이의 값 import와 type import를 구분해 추적하세요.
pages 간 참조, features의 데이터 로직, 레이어가 아닌 alias, barrel, 한 파일 다중 컴포넌트 export, 런타임 순환을 점검하세요.
