name: Release

on:
    push:
        branches: [main]
        paths:
            - 'docs/**'
            - 'install-files/**'
            - '.github/workflows/release.yml'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Compute next version
              id: version
              run: |
                  latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
                  if [ -z "$latest" ]; then
                      major=1; minor=0; patch=0
                  else
                      IFS=. read -r major minor patch <<<"${latest#v}"
                      log="$(git log --format='%s%n%b' "$latest"..HEAD)"
                      if [ -z "$(echo "$log" | tr -d '[:space:]')" ]; then
                          echo "skip=true" >>"$GITHUB_OUTPUT"
                          exit 0
                      fi
                      bump=patch
                      echo "$log" | grep -qE '^[a-z]+(\([^)]*\))?!:' && bump=major
                      echo "$log" | grep -q 'BREAKING CHANGE' && bump=major
                      if [ "$bump" = patch ]; then
                          echo "$log" | grep -qE '^feat(\([^)]*\))?:' && bump=minor
                      fi
                      case "$bump" in
                          major) major=$((major + 1)); minor=0; patch=0 ;;
                          minor) minor=$((minor + 1)); patch=0 ;;
                          patch) patch=$((patch + 1)) ;;
                      esac
                  fi
                  while :; do
                      case "$major" in *4*) major=$((major + 1)); minor=0; patch=0; continue ;; esac
                      case "$minor" in *4*) minor=$((minor + 1)); patch=0; continue ;; esac
                      case "$patch" in *4*) patch=$((patch + 1)); continue ;; esac
                      break
                  done
                  echo "version=v$major.$minor.$patch" >>"$GITHUB_OUTPUT"

            - name: Build bundle
              if: steps.version.outputs.skip != 'true'
              run: tar -czf "$RUNNER_TEMP/llm-rules.tar.gz" docs install-files

            - name: Create release
              if: steps.version.outputs.skip != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/llm-rules.tar.gz" \
                      --title "${{ steps.version.outputs.version }}" \
                      --target "$GITHUB_SHA" \
                      --generate-notes
